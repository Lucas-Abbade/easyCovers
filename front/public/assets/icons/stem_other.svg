<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="oth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="oth-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect x="12" y="12" width="176" height="176" rx="48" fill="url(#oth-grad)" filter="url(#oth-shadow)" />
  <rect x="13" y="13" width="174" height="174" rx="47" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <!-- Synth / FX Audio Frequency Console -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sine to Square Oscillator Wave -->
    <path d="M42 90 Q 56 60, 70 90 T 98 90 L 98 66 L 126 66 L 126 114 L 154 114 L 154 90" 
          stroke-width="7" />
    <!-- Oscilloscope display frame -->
    <rect x="36" y="52" width="128" height="76" rx="12" stroke-width="5" stroke-dasharray="6 4" opacity="0.4" />
    <!-- Rotary Modulation Knobs -->
    <g stroke-width="5">
      <circle cx="62" cy="148" r="12" fill="rgba(255,255,255,0.15)" />
      <line x1="62" y1="148" x2="68" y2="140" stroke-width="4" />
      
      <circle cx="100" cy="148" r="12" fill="rgba(255,255,255,0.15)" />
      <line x1="100" y1="148" x2="100" y2="138" stroke-width="4" />
      
      <circle cx="138" cy="148" r="12" fill="rgba(255,255,255,0.15)" />
      <line x1="138" y1="148" x2="145" y2="142" stroke-width="4" />
    </g>
  </g>
</svg>